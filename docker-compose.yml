services:
  dashboard:
    build: .
    image: qos-staff-dashboard
    container_name: qos-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped
    # Mount the shared link config as a volume so you can edit links live
    # (no rebuild needed): change config/links.json, bump "version", done.
    volumes:
      - ./config/links.json:/usr/share/nginx/html/config/links.json:ro
