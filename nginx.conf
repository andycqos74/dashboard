server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Never cache the link config or the app shell so manual edits and
    # config-version bumps are picked up on the next page load.
    location = /config/links.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Long-cache the static crest asset.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
