server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Never cache the link config or the app shell so manual edits and
    # config-version bumps are picked up on the next page load.
    location = /config/links.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Long-cache the static crest asset.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Logo uploads: same-origin path proxied to the uploader sidecar, which
    # holds the Combined Storage credentials. Keeps the browser free of secrets
    # and avoids CORS. Returns the public /f/<token> URL.
    location = /upload {
        # Resolve the upstream per-request via Docker's embedded DNS. Passing a
        # hostname literally would make nginx resolve it at startup and refuse
        # to boot when the uploader isn't deployed; via a variable the site
        # still serves and only /upload returns 502.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $uploader_upstream http://uploader:3000/upload;
        proxy_pass $uploader_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 8m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
