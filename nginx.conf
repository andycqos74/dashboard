# Two views of the same site:
#
#   :80    staff view   — full editing, uploads, "Save for everyone"
#   :8080  public view  — read-only; the editing endpoints are refused here, so
#                         this port is safe to expose (e.g. via a tunnel) even
#                         though the staff view has no login.
#
# Read-only is enforced by this server, not just hidden in the UI: the browser
# is told the mode via /config/mode.json, and the write endpoints return 403
# regardless of what the page tries.

# ---------------------------------------------------------------- staff view
server {
    listen       80;
    server_name  _;

    # Let the uploader's own error responses (which carry the real reason, as
    # JSON) reach the browser untouched. Only errors nginx generates itself -
    # i.e. it could not reach the uploader at all - hit @uploader_down below.
    proxy_intercept_errors off;

    include /etc/nginx/app-static.conf;

    location = /config/mode.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"readOnly":false}';
    }

    # Diagnostics, reachable from any browser on the network:
    #   http://<host>:1919/uploader-health?probe=1
    location = /uploader-health {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $health_upstream http://uploader:3000/health$is_args$args;
        proxy_pass $health_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
        error_page 502 504 = @uploader_down;
    }

    # When nginx itself cannot reach the uploader, answer with JSON the app can
    # show, rather than nginx's HTML error page (which the UI can only report
    # as a bare "502").
    location @uploader_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        # No embedded double quotes here on purpose: escaping them inside an
        # nginx string is easy to get subtly wrong and would emit broken JSON.
        return 502 '{"error":"Cannot reach the uploader service - check the uploader container is running in this stack."}';
    }

    # "Save for everyone": rewrites config/links.json via the uploader.
    location = /publish {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $publish_upstream http://uploader:3000/publish;
        proxy_pass $publish_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 1m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        error_page 502 504 = @uploader_down;
    }

    # Pull a logo off a website (og:image / apple-touch-icon / favicon).
    location = /grab {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $grab_upstream http://uploader:3000/grab$is_args$args;
        proxy_pass $grab_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        error_page 502 504 = @uploader_down;
    }

    # Logo uploads: same-origin path proxied to the uploader sidecar, which holds
    # the Combined Storage credentials. Keeps the browser free of secrets and
    # avoids CORS. Returns the public /f/<token> URL.
    location = /upload {
        # Resolve the upstream per-request via Docker's embedded DNS. Passing a
        # hostname literally would make nginx resolve it at startup and refuse
        # to boot when the uploader isn't deployed; via a variable the site
        # still serves and only /upload returns 502.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $uploader_upstream http://uploader:3000/upload$is_args$args;
        proxy_pass $uploader_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 8m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        error_page 502 504 = @uploader_down;
    }
}

# --------------------------------------------------------------- public view
# Same files, same links, no way to change anything.
server {
    listen       8080;
    server_name  _;

    include /etc/nginx/app-static.conf;

    location = /config/mode.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"readOnly":true}';
    }

    # Refuse every write path here, so this port stays read-only even if a page
    # is modified, cached from the staff view, or the endpoints are called
    # directly. This is what makes the public URL safe to expose.
    location = /publish { default_type application/json; add_header Cache-Control "no-store" always; return 403 '{"error":"This is the read-only view of the dashboard."}'; }
    location = /upload  { default_type application/json; add_header Cache-Control "no-store" always; return 403 '{"error":"This is the read-only view of the dashboard."}'; }
    location = /grab    { default_type application/json; add_header Cache-Control "no-store" always; return 403 '{"error":"This is the read-only view of the dashboard."}'; }
    location = /uploader-health { return 404; }
}
