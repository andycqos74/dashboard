# QoS Staff Dashboard — Portainer stack
#
# Recommended deploy method: Portainer → Stacks → Add stack → "Repository".
#   Repository URL:  <this repo>
#   Reference:       refs/heads/main
#   Compose path:    portainer-stack.yml
# Portainer clones the repo and builds the images from the Dockerfiles, so the
# links baked in come straight from config/links.json in the repo.
#
# Environment variables (set in Portainer's "Environment variables" panel):
#   DASHBOARD_PORT   host port to publish (default 1919)
#   CS_BASE_URL      How the UPLOADER reaches Combined Storage from inside Docker.
#                    Defaults to http://combinedstorage:4000 over the shared
#                    network below, so it usually needs no value at all. Do NOT
#                    use the public hostname with the app port: that name is
#                    served by the tunnel on 443, so ...:4000 times out from a
#                    container. Logo URLs staff see are unaffected - Combined
#                    Storage builds those from its own PUBLIC_BASE_URL.
#   CS_NETWORK       Combined Storage's existing Docker network. Defaults to
#                    cloudflared-combinedstorage_default; confirm with
#                    `docker network ls` and override if yours differs.
#   CS_USERNAME      Combined Storage admin username
#   CS_PASSWORD      Combined Storage admin password
#   CS_PARENT_ID     folder to upload logos into (default "root")
#   CS_INSECURE_TLS  set to 1 only for a self-signed cert on a trusted network
#   PUBLISH_KEY      optional shared secret required by "Save for everyone".
#                    Leave unset so anyone on the network can publish.
#
# Leave the CS_* variables unset to run without logo uploads: the dashboard
# still serves normally and config/storage.json decides the fallback.

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: qos-staff-dashboard:latest
    container_name: qos-dashboard
    ports:
      - "${DASHBOARD_PORT:-1919}:80"
    restart: unless-stopped
    # Shared with the uploader so "Save for everyone" can rewrite links.json.
    # Docker seeds this volume from the image the first time it is created, so
    # a new deployment starts with the link set baked into the repo.
    volumes:
      - dashboard-config:/usr/share/nginx/html/config
    # Probe 127.0.0.1, not "localhost": localhost can resolve to ::1 first and
    # nginx listens on IPv4 only, which fails with "connection refused" even
    # though the site is serving correctly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Holds the Combined Storage credentials so the browser never sees them, and
  # exposes only POST /upload (reached at /upload via the dashboard's nginx).
  # Deliberately not published to the host.
  uploader:
    build:
      context: ./uploader
      dockerfile: Dockerfile
    image: qos-dashboard-uploader:latest
    container_name: qos-dashboard-uploader
    restart: unless-stopped
    # Fallback route to ports published on the Docker host, if you ever switch
    # CS_BASE_URL to http://host.docker.internal:4000.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Writable: this service rewrites links.json on "Save for everyone".
    volumes:
      - dashboard-config:/config
    networks:
      # "default" is this stack's own network — the uploader MUST stay on it or
      # nginx in the dashboard container cannot reach it. Declaring `networks:`
      # replaces the default membership rather than adding to it.
      - default
      # Combined Storage's network, so it answers as combinedstorage:4000.
      - combinedstorage
    environment:
      CS_BASE_URL: "${CS_BASE_URL:-http://combinedstorage:4000}"
      CS_USERNAME: "${CS_USERNAME:-}"
      CS_PASSWORD: "${CS_PASSWORD:-}"
      CS_PARENT_ID: "${CS_PARENT_ID:-root}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-8388608}"
      CS_INSECURE_TLS: "${CS_INSECURE_TLS:-0}"
      PUBLISH_KEY: "${PUBLISH_KEY:-}"

networks:
  # Combined Storage's existing network, created by its own stack, so the
  # uploader can resolve the container by name. It must already exist - check
  # the exact name with `docker network ls` and set CS_NETWORK if it differs.
  # Deploying will fail with "network not found" if this name is wrong.
  combinedstorage:
    name: ${CS_NETWORK:-cloudflared-combinedstorage_default}
    external: true

volumes:
  # Holds config/links.json so it survives redeploys and is shared by both
  # containers. Delete this volume to go back to the link set in the repo.
  dashboard-config:
