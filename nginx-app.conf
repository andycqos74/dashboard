# Static serving shared by both the staff and public server blocks, so the two
# views can never drift apart in how they serve the app itself.
root   /usr/share/nginx/html;
index  index.html;

# Never cache the link config or the app shell so edits and config-version
# bumps are picked up on the next page load.
location = /config/links.json {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
}
location = /config/storage.json {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
}
location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
}
# storage.js must never be cached independently of index.html: a fresh page
# paired with a stale script means missing functions and a broken dialog.
location = /storage.js {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
}

# Long-cache the static crest asset.
location /assets/ {
    expires 30d;
    add_header Cache-Control "public";
}

location / {
    try_files $uri $uri/ /index.html;
}
