<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QoS Staff Dashboard</title>
<link rel="icon" href="assets/qos-crest.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1D2C69; --navy-deep:#131E4A; --navy-soft:#3A4C96;
    --bg:#F4F6FB; --bg2:#EAEEF7; --surface:#FFFFFF; --surface2:#F8FAFD;
    --text:#12193A; --text-dim:#5C6588; --line:#E1E6F2; --line-strong:#CFD6E9;
    --tile:#FFFFFF; --shadow:0 1px 2px rgba(19,30,74,.06),0 8px 24px rgba(19,30,74,.07);
    --shadow-lift:0 2px 6px rgba(19,30,74,.10),0 18px 40px rgba(19,30,74,.16);
  }
  [data-theme="dark"]{
    --bg:#0C1330; --bg2:#111A3D; --surface:#151F45; --surface2:#1B2653;
    --text:#EEF1FA; --text-dim:#95A0C6; --line:#26325E; --line-strong:#35426F;
    --tile:#182352; --navy:#5A73D6; --navy-soft:#8DA0EA;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
    --shadow-lift:0 2px 8px rgba(0,0,0,.45),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Barlow,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--navy);text-decoration:none}
  a:hover{color:var(--navy-soft)}
  input,button{font-family:inherit}
  ::placeholder{color:var(--text-dim);opacity:1}

  /* Hover motion (design uses style-hover; recreated with real CSS) */
  .tile:hover,.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)!important;border-color:var(--line-strong)!important}
  .recent-chip:hover{border-color:var(--line-strong)!important;color:var(--navy)!important}
  .compact-row:hover{background:var(--surface2)}
  .theme-btn:hover,.tab:hover{border-color:var(--line-strong)}
  .primary-btn:hover{background:var(--navy-soft)!important}
  .edit-btn:hover{opacity:1!important;background:var(--surface2)!important}
  .modal-close:hover{color:var(--text)!important}
  .reset-btn:hover{color:var(--navy)!important}
  .delete-btn:hover{border-color:#C2415A!important}
  .link-btn{-webkit-tap-highlight-color:transparent}

  /* Drag & drop feedback */
  [data-id]{cursor:grab}
  [data-id]:active{cursor:grabbing}
  .link-btn{cursor:pointer}
  .dragging{opacity:.4}
  .drop-target{outline:2px dashed var(--gc,var(--navy));outline-offset:2px;border-radius:12px}
  .chev:hover{opacity:.7}
  /* Native colour-input chrome reset */
  input[type=color]{-webkit-appearance:none;appearance:none}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:4px}
  input[type=color]::-moz-color-swatch{border:none;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  "use strict";

  var KEY = 'qos-dash-v1';
  var HUES = [258, 232, 212, 282, 196, 244];

  // ---- state ----
  var state = {
    links: [],           // [{id,name,url,group,fav,color?,icon?}]
    recents: [],         // link ids, most-recent first, max 6
    groupColors: {},     // { groupName: '#rrggbb' } — editable per-tab colour
    collapsed: {},       // { groupName: true } — collapsed groups (per browser)
    theme: 'light',
    layout: 'grouped',
    query: '',
    modalOpen: false,
    editId: null,
    version: 0           // config version this browser was seeded from
  };
  var drag = null;
  var DEFAULT_GC = '#3A55C6'; // fallback colour for a group with none set

  // ---- helpers ----
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function host(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch (e) { return String(url).replace(/^https?:\/\//, '').split('/')[0]; }
  }
  function initials(name) {
    var w = name.replace(/[^\w\s&]/g, ' ').split(/\s+/).filter(Boolean);
    return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
  }
  function hueFor(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 997;
    return HUES[h % HUES.length];
  }
  function gcFor(name) { return state.groupColors[name] || DEFAULT_GC; }

  function hexToRgba(hex, a) {
    var h = String(hex).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    if (isNaN(n)) return 'rgba(90,100,140,' + a + ')';
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  // ---- brand icons (inline SVG, self-contained/offline) ----
  var BRANDS = {
    google: '<svg viewBox="0 0 48 48" width="22" height="22"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.5-2.1 14.3-5.6l-6.6-5.6C29.7 34.5 27 35.5 24 35.5c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.4l6.6 5.6C41.9 35.7 44 30.3 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>',
    gmail: '<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#EA4335" d="M2 5.6C2 4.7 2.7 4 3.6 4L12 10.4 20.4 4c.9 0 1.6.7 1.6 1.6v12.8c0 .9-.7 1.6-1.6 1.6H19V9.2l-7 5.2-7-5.2V20H3.6C2.7 20 2 19.3 2 18.4V5.6z"/></svg>',
    drive: '<svg viewBox="0 0 87.3 78" width="22" height="22"><path fill="#0066da" d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z"/><path fill="#00ac47" d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44c-.8 1.4-1.2 2.95-1.2 4.5h27.5z"/><path fill="#ea4335" d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z"/><path fill="#00832d" d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z"/><path fill="#2684fc" d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z"/><path fill="#ffba00" d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z"/></svg>',
    docs: '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="2" width="16" height="20" rx="2" fill="#7248B9"/><rect x="7" y="7" width="10" height="1.6" fill="#fff"/><rect x="7" y="11" width="10" height="1.6" fill="#fff"/><rect x="7" y="15" width="6" height="1.6" fill="#fff"/></svg>',
    microsoft: '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="2" width="9" height="9" fill="#F25022"/><rect x="13" y="2" width="9" height="9" fill="#7FBA00"/><rect x="2" y="13" width="9" height="9" fill="#00A4EF"/><rect x="13" y="13" width="9" height="9" fill="#FFB900"/></svg>',
    onedrive: '<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#0364B8" d="M13.2 7.2a5 5 0 0 0-4.7 3.1A4 4 0 0 0 5 17.5h12.7a3.4 3.4 0 0 0 .2-6.8 5 5 0 0 0-4.7-3.5z"/></svg>',
    outlook: '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="9" y="5" width="13" height="14" rx="1.2" fill="#0A2767"/><rect x="9" y="5" width="13" height="7" fill="#0364B8"/><rect x="1" y="4" width="12" height="16" rx="2" fill="#0F6CBD"/><ellipse cx="7" cy="12" rx="3.1" ry="3.5" fill="none" stroke="#fff" stroke-width="1.6"/></svg>',
    amazon: '<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#FF9900" d="M4 16c4.5 3 11.5 3 16 .2.4-.2.7.2.4.5C17.8 20 13 21 9 19.4 6.7 18.5 5 17.2 4 16z"/><path fill="#221F1F" d="M13 5c-2.5 0-4 1.3-4.3 3l2 .2c.1-1 .8-1.5 2-1.5 1.3 0 1.8.7 1.8 2v.4c-3.7 0-5.8 1.1-5.8 3.6 0 1.6 1.2 2.6 3 2.6 1.4 0 2.3-.5 3-1.4.2.7.9 1.2 1.7 1.3l1-1.4c-.6-.3-.8-.7-.8-1.6V8.6C16.6 6.2 15.4 5 13 5zm1.5 6.6c0 1.3-.8 2.1-2 2.1-.8 0-1.3-.5-1.3-1.2 0-1.2 1.1-1.7 3.3-1.7z"/></svg>',
    xero: '<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="10" fill="#13B5EA"/><path d="M9 9l6 6M15 9l-6 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
    wix: '<svg viewBox="0 0 24 24" width="22" height="22"><text x="12" y="16" font-family="Arial,sans-serif" font-weight="700" font-size="8.5" fill="#0C6EFC" text-anchor="middle">WIX</text></svg>',
    dropbox: '<svg viewBox="0 0 24 24" width="20" height="20"><path fill="#0061FF" d="M7 3 2 6.3l5 3.2 5-3.2zM17 3l-5 3.3 5 3.2 5-3.2zM2 12.7l5 3.2 5-3.2-5-3.2zM17 9.5l-5 3.2 5 3.2 5-3.2zM7 17.5l5 3.2 5-3.2-5-3.1z"/></svg>',
    postoffice: '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="3" fill="#E4002B"/><text x="12" y="16" font-family="Arial,sans-serif" font-weight="700" font-size="10" fill="#fff" text-anchor="middle">PO</text></svg>',
    globe: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#5C6588" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>'
  };
  // aliases → canonical brand key
  var BRAND_ALIAS = { forms: 'docs', sheets: 'docs', office: 'microsoft', office365: 'microsoft', sharepoint: 'onedrive', teams: 'microsoft', hotmail: 'outlook' };
  function brandKey(k) { k = String(k || '').toLowerCase().trim(); return BRAND_ALIAS[k] || (BRANDS[k] ? k : ''); }

  // Guess a brand icon from a link's URL / name.
  function detectBrand(url, name) {
    var h = host(url).toLowerCase();
    var n = (name || '').toLowerCase();
    var s = h + ' ' + n;
    if (/mail\.google|gmail/.test(s)) return 'gmail';
    if (/drive\.google/.test(s)) return 'drive';
    if (/docs\.google|forms\.google|\bforms\b|google\s*forms|sheets/.test(s)) return 'docs';
    if (/google/.test(s)) return 'google';
    if (/postoffice|post ?office|drop.?and.?go/.test(s)) return 'postoffice';
    if (/onedrive|1drv|live\.com|sharepoint/.test(s)) return 'onedrive';
    if (/outlook|hotmail/.test(s)) return 'outlook';
    if (/microsoft|office\.com|office365|office365|\bms ?office\b|\bteams\b/.test(s)) return 'microsoft';
    if (/amazon/.test(s)) return 'amazon';
    if (/xero/.test(s)) return 'xero';
    if (/wix/.test(s)) return 'wix';
    if (/dropbox/.test(s)) return 'dropbox';
    return '';
  }

  // Resolve accent colours for a link (custom hex, else name-hashed hue).
  function accent(l) {
    if (l.color) {
      return { text: l.color, bg: hexToRgba(l.color, 0.14), border: hexToRgba(l.color, 0.34), dot: l.color };
    }
    var hue = hueFor(l.name);
    return {
      text: 'oklch(0.42 0.14 ' + hue + ')',
      bg: 'oklch(0.93 0.045 ' + hue + ')',
      border: 'oklch(0.87 0.06 ' + hue + ')',
      dot: 'oklch(0.58 0.15 ' + hue + ')'
    };
  }

  // Badge inner content: explicit icon, else auto-detected brand, else initials.
  function badgeInner(l) {
    var raw = (l.icon || '').trim();
    var key = brandKey(raw || detectBrand(l.url, l.name));
    if (key && BRANDS[key]) return BRANDS[key];
    if (/^https?:\/\//i.test(raw)) {
      return '<img src="' + esc(raw) + '" alt="" style="width:24px;height:24px;object-fit:contain" ' +
        'onerror="this.parentNode.textContent=\'' + esc(initials(l.name)) + '\'">';
    }
    if (raw) return '<span style="font-size:20px;line-height:1">' + esc(raw) + '</span>'; // emoji / short text
    return esc(initials(l.name));
  }
  function badgeStyle(hue) {
    return "display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;border-radius:11px;font-family:'Barlow Condensed',Barlow,sans-serif;font-size:16px;font-weight:700;letter-spacing:.02em;color:oklch(0.42 0.14 " + hue + ");background:oklch(0.93 0.045 " + hue + ");border:1px solid oklch(0.87 0.06 " + hue + ")";
  }
  function dotStyle(hue) {
    return "width:9px;height:9px;flex:none;border-radius:3px;background:oklch(0.58 0.15 " + hue + ")";
  }
  function favStyle(fav) {
    return "width:26px;height:26px;border-radius:8px;border:0;background:transparent;font-size:13px;cursor:pointer;color:" + (fav ? 'var(--navy)' : 'var(--text-dim)') + ";opacity:" + (fav ? 1 : 0.5);
  }

  // ---- persistence ----
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        version: state.version,
        links: state.links,
        recents: state.recents,
        groupColors: state.groupColors,
        collapsed: state.collapsed,
        theme: state.theme,
        layout: state.layout
      }));
    } catch (e) {}
  }

  // ---- seeding from shared config ----
  function seedFrom(config, saved) {
    var cfgVersion = (config && config.version) || 1;
    var cfgLinks = (config && Array.isArray(config.links)) ? config.links : [];
    var cfgColors = (config && config.groupColors) || {};
    var seeded = cfgLinks.map(function (l, i) {
      var o = { id: 'l' + i, name: l.name, url: l.url, group: l.group || 'Other', fav: !!l.fav };
      if (l.icon) o.icon = l.icon;
      if (l.color) o.color = l.color;
      return o;
    });

    // Preserve personal UI prefs from any saved state.
    if (saved) {
      state.theme = saved.theme || state.theme;
      state.layout = saved.layout || state.layout;
      state.collapsed = saved.collapsed || {};
    }

    // Re-seed links + group colours whenever the shared config version changes.
    if (saved && Array.isArray(saved.links) && saved.version === cfgVersion) {
      state.links = saved.links;
      state.recents = Array.isArray(saved.recents) ? saved.recents : [];
      state.groupColors = saved.groupColors || cfgColors;
    } else {
      state.links = seeded;
      state.recents = [];
      state.groupColors = cfgColors;
    }
    state.version = cfgVersion;
    persist();
  }

  // ---- link ops ----
  function findLink(id) {
    for (var i = 0; i < state.links.length; i++) if (state.links[i].id === id) return state.links[i];
    return null;
  }
  function recordOpen(id) {
    state.recents = [id].concat(state.recents.filter(function (r) { return r !== id; })).slice(0, 6);
    persist();
    renderContent();
  }
  function toggleFav(id) {
    var l = findLink(id);
    if (l) { l.fav = !l.fav; persist(); renderContent(); }
  }
  function move(fromId, toId) {
    if (!fromId || fromId === toId) return;
    var from = -1, to = -1, i;
    for (i = 0; i < state.links.length; i++) {
      if (state.links[i].id === fromId) from = i;
      if (state.links[i].id === toId) to = i;
    }
    if (from < 0 || to < 0) return;
    var item = state.links.splice(from, 1)[0];
    item.group = state.links[to > from ? to - 1 : to].group;
    state.links.splice(to, 0, item);
    persist();
    renderContent();
  }

  // ---- derived view ----
  function decorate(l) {
    var ac = accent(l);
    var badge = "display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;border-radius:11px;overflow:hidden;font-family:'Barlow Condensed',Barlow,sans-serif;font-size:16px;font-weight:700;letter-spacing:.02em;color:" + ac.text + ";background:" + ac.bg + ";border:1px solid " + ac.border;
    return {
      id: l.id, name: l.name, url: l.url, group: l.group, fav: l.fav,
      host: host(l.url), initials: initials(l.name),
      badge: badge, inner: badgeInner(l),
      dot: 'width:9px;height:9px;flex:none;border-radius:3px;background:' + ac.dot,
      favS: favStyle(l.fav)
    };
  }
  function view() {
    var q = state.query.trim().toLowerCase();
    var match = function (l) {
      return !q || l.name.toLowerCase().indexOf(q) >= 0 ||
        l.url.toLowerCase().indexOf(q) >= 0 ||
        (l.group || '').toLowerCase().indexOf(q) >= 0;
    };
    var visible = state.links.filter(match).map(decorate);

    var groupNames = [];
    visible.forEach(function (l) { if (groupNames.indexOf(l.group) < 0) groupNames.push(l.group); });
    var groups = groupNames.map(function (name) {
      var links = visible.filter(function (l) { return l.group === name; });
      return { name: name, links: links, count: links.length };
    });

    return {
      q: q, visible: visible, groups: groups, groupNames: groupNames,
      favourites: visible.filter(function (l) { return l.fav; }),
      recents: state.recents.map(function (id) { return findLink(id); })
        .filter(Boolean).map(decorate)
    };
  }

  // ================= RENDER =================

  function shell() {
    var hour = new Date().getHours();
    var greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    var themeIcon = state.theme === 'dark' ? '☀' : '☾';

    var root = document.getElementById('root');
    root.innerHTML =
      '<div id="wrap" data-theme="' + esc(state.theme) + '" style="min-height:100vh;background:radial-gradient(1200px 600px at 50% -280px, var(--bg2), var(--bg) 70%);padding:34px 32px 72px;color:var(--text)">' +
        '<div style="max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px">' +

          '<header style="display:flex;align-items:center;gap:18px">' +
            '<img src="assets/qos-crest.png" alt="Queen of the South FC crest" style="width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:var(--shadow);flex:none">' +
            '<div style="display:flex;flex-direction:column;gap:2px;margin-right:auto">' +
              '<div style="font-family:\'Barlow Condensed\',Barlow,sans-serif;font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--navy)">Queen of the South FC</div>' +
              '<div style="font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1">' + greeting + ', Doonhamers</div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:10px">' +
              '<div style="display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)">' +
                '<button class="tab" data-act="grouped" style="' + tabStyle(state.layout === 'grouped') + '">Grouped</button>' +
                '<button class="tab" data-act="compact" style="' + tabStyle(state.layout === 'compact') + '">Compact</button>' +
              '</div>' +
              '<button class="theme-btn" data-act="theme" title="Toggle light / dark" style="width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px;cursor:pointer;box-shadow:var(--shadow)">' + themeIcon + '</button>' +
              '<button class="primary-btn" data-act="add" style="height:40px;padding:0 18px;border-radius:999px;border:0;background:var(--navy);color:#fff;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px"><span style="font-size:17px;line-height:1">+</span>Add link</button>' +
            '</div>' +
          '</header>' +

          '<div style="display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 18px;height:60px;box-shadow:var(--shadow)">' +
            '<span style="font-size:19px;color:var(--text-dim)">⌕</span>' +
            '<input id="q" value="' + esc(state.query) + '" placeholder="Search your links, or press ↵ to search the web" style="flex:1;border:0;outline:none;background:transparent;color:var(--text);font-size:17px;font-weight:500;min-width:0">' +
            '<span id="hint" style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);border:1px solid var(--line);border-radius:8px;padding:5px 9px;white-space:nowrap"></span>' +
          '</div>' +

          '<div id="content"></div>' +

          '<footer style="display:flex;align-items:center;gap:10px;padding-top:6px;font-size:12.5px;color:var(--text-dim)">' +
            '<span>Drag a tile to reorder · ★ to pin · saved in this browser</span>' +
            '<span style="flex:1;height:1px;background:var(--line)"></span>' +
            '<button class="reset-btn" data-act="reset" style="border:0;background:transparent;color:var(--text-dim);font-size:12.5px;cursor:pointer;text-decoration:underline">Reset to defaults</button>' +
          '</footer>' +
        '</div>' +
        '<div id="modal"></div>' +
      '</div>';

    // search input listeners (attached once per shell build)
    var q = document.getElementById('q');
    q.addEventListener('input', function (e) { state.query = e.target.value; renderContent(); });
    q.addEventListener('keydown', onSearchKey);

    renderContent();
  }

  function tabStyle(on) {
    return 'border:0;background:' + (on ? 'var(--navy)' : 'transparent') + ';color:' + (on ? '#fff' : 'var(--text-dim)') + ';font-size:13px;font-weight:600;padding:7px 15px;border-radius:999px;cursor:pointer';
  }

  function tileHTML(l) {
    // pinned tile (horizontal)
    return '<a class="tile link-btn" href="' + esc(l.url) + '" target="_blank" rel="noopener" data-open="' + esc(l.id) + '" draggable="true" data-id="' + esc(l.id) + '" style="position:relative;display:flex;align-items:center;gap:13px;background:var(--tile);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow);color:var(--text);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease">' +
      '<span style="' + l.badge + '">' + l.inner + '</span>' +
      '<span style="display:flex;flex-direction:column;gap:2px;min-width:0">' +
        '<span style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(l.name) + '</span>' +
        '<span style="font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(l.host) + '</span>' +
      '</span>' +
    '</a>';
  }

  function cardHTML(l) {
    return '<div class="card" draggable="true" data-id="' + esc(l.id) + '" style="position:relative;background:var(--tile);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease">' +
      '<a class="link-btn" draggable="false" href="' + esc(l.url) + '" target="_blank" rel="noopener" data-open="' + esc(l.id) + '" style="display:flex;flex-direction:column;gap:12px;padding:17px 17px 15px;color:var(--text)">' +
        '<span style="' + l.badge + '">' + l.inner + '</span>' +
        '<span style="display:flex;flex-direction:column;gap:3px;min-width:0">' +
          '<span style="font-size:16px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(l.name) + '</span>' +
          '<span style="font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(l.host) + '</span>' +
        '</span>' +
      '</a>' +
      '<div style="position:absolute;top:11px;right:11px;display:flex;gap:4px">' +
        '<button data-act="fav" data-id="' + esc(l.id) + '" title="Pin" style="' + l.favS + '">★</button>' +
        '<button class="edit-btn" data-act="edit" data-id="' + esc(l.id) + '" title="Edit" style="width:26px;height:26px;border-radius:8px;border:0;background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;opacity:.55">✎</button>' +
      '</div>' +
    '</div>';
  }

  function compactRowHTML(l) {
    return '<div class="compact-row" draggable="true" data-id="' + esc(l.id) + '" style="display:flex;align-items:center;border-radius:12px">' +
      '<a class="link-btn" draggable="false" href="' + esc(l.url) + '" target="_blank" rel="noopener" data-open="' + esc(l.id) + '" style="flex:1;display:flex;align-items:center;gap:12px;padding:10px 8px 10px 10px;min-width:0;color:var(--text)">' +
        '<span style="' + l.dot + '"></span>' +
        '<span style="font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(l.name) + '</span>' +
        '<span style="margin-left:auto;font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%">' + esc(l.host) + '</span>' +
      '</a>' +
      '<div style="display:flex;gap:2px;padding-right:8px">' +
        '<button data-act="fav" data-id="' + esc(l.id) + '" title="Pin" style="' + l.favS + '">★</button>' +
        '<button class="edit-btn" data-act="edit" data-id="' + esc(l.id) + '" title="Edit" style="width:26px;height:26px;border-radius:8px;border:0;background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;opacity:.55">✎</button>' +
      '</div>' +
    '</div>';
  }

  function sectionLabel(text, color) {
    return '<h2 style="margin:0;font-family:\'Barlow Condensed\',Barlow,sans-serif;font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:' + color + '">' + esc(text) + '</h2>';
  }

  // Group header with an editable colour swatch. `--gc` is set on the parent
  // <section>; heading / rule / count all read var(--gc).
  function colorSwatch(name) {
    return '<input type="color" data-gc="' + esc(name) + '" value="' + esc(gcFor(name)) + '" title="Change ' + esc(name) + ' colour" class="gc-swatch" style="width:20px;height:20px;flex:none;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer">';
  }
  function groupHeader(g, fontSize, collapsed) {
    return '<div style="display:flex;align-items:center;gap:8px">' +
      '<button data-act="collapse" data-group="' + esc(g.name) + '" class="chev" title="' + (collapsed ? 'Expand' : 'Collapse') + '" style="width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--gc);font-size:11px;cursor:pointer;transition:transform .15s ease;transform:rotate(' + (collapsed ? '-90deg' : '0deg') + ')">▼</button>' +
      '<h2 style="margin:0;font-family:\'Barlow Condensed\',Barlow,sans-serif;font-size:' + fontSize + ';font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gc);cursor:pointer" data-act="collapse" data-group="' + esc(g.name) + '">' + esc(g.name) + '</h2>' +
      '<span style="flex:1;height:1px;background:var(--gc);opacity:.35"></span>' +
      '<span style="font-size:12px;font-weight:600;color:var(--gc)">' + g.count + '</span>' +
      colorSwatch(g.name) +
    '</div>';
  }

  function renderContent() {
    var v = view();
    var hintEl = document.getElementById('hint');
    if (hintEl) {
      hintEl.textContent = v.q
        ? (v.visible.length + ' match' + (v.visible.length === 1 ? '' : 'es'))
        : 'Web search ↵';
    }

    var html = '';

    // Pinned (hidden when query active or none pinned)
    if (!v.q && v.favourites.length) {
      html += '<section style="display:flex;flex-direction:column;gap:14px">' +
        '<div style="display:flex;align-items:baseline;gap:10px">' + sectionLabel('Pinned', 'var(--text-dim)') +
          '<span style="font-size:13px;color:var(--text-dim)">Your most-used tools</span></div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:14px">' +
          v.favourites.map(tileHTML).join('') + '</div></section>';
    }

    // Recent (hidden when query active or none)
    if (!v.q && v.recents.length) {
      html += '<section style="display:flex;flex-wrap:wrap;align-items:center;gap:9px">' +
        '<h2 style="margin:0 6px 0 0;font-family:\'Barlow Condensed\',Barlow,sans-serif;font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim)">Recent</h2>' +
        v.recents.map(function (l) {
          return '<a class="recent-chip link-btn" href="' + esc(l.url) + '" target="_blank" rel="noopener" data-open="' + esc(l.id) + '" style="display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 9px;font-size:13px;font-weight:600;color:var(--text)">' +
            '<span style="' + l.dot + '"></span>' + esc(l.name) + '</a>';
        }).join('') + '</section>';
    }

    // Empty state
    if (state.links.length > 0 && v.visible.length === 0) {
      html += '<div style="text-align:center;padding:70px 20px;border:1px dashed var(--line-strong);border-radius:20px;color:var(--text-dim)">' +
        '<div style="font-size:17px;font-weight:600;color:var(--text);margin-bottom:6px">Nothing matches “' + esc(state.query) + '”</div>' +
        '<div style="font-size:14px">Press ↵ to search the web instead.</div></div>';
    } else if (state.layout === 'grouped') {
      html += '<div style="display:flex;flex-direction:column;gap:30px">' +
        v.groups.map(function (g) {
          var collapsed = !!state.collapsed[g.name];
          return '<section style="display:flex;flex-direction:column;gap:14px;--gc:' + gcFor(g.name) + '">' +
            groupHeader(g, '14px', collapsed) +
            (collapsed ? '' :
              '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px">' +
              g.links.map(cardHTML).join('') + '</div>') + '</section>';
        }).join('') + '</div>';
    } else {
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start">' +
        v.groups.map(function (g) {
          var collapsed = !!state.collapsed[g.name];
          return '<section style="background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px 6px ' + (collapsed ? '6px' : '8px') + ';--gc:' + gcFor(g.name) + '">' +
            '<div style="padding:13px 14px 11px">' + groupHeader(g, '13.5px', collapsed) + '</div>' +
            (collapsed ? '' :
              '<div style="display:flex;flex-direction:column">' + g.links.map(compactRowHTML).join('') + '</div>') + '</section>';
        }).join('') + '</div>';
    }

    document.getElementById('content').innerHTML = html;
  }

  // ================= MODAL =================

  function openModal(editId) {
    state.modalOpen = true;
    state.editId = editId || null;
    var v = view();
    var draft = { name: '', url: '', group: v.groupNames[0] || 'Operations', icon: '', color: '' };
    if (editId) {
      var l = findLink(editId);
      if (l) draft = { name: l.name, url: l.url, group: l.group, icon: l.icon || '', color: l.color || '' };
    }
    var autoColor = !draft.color;
    var colorVal = draft.color || gcFor(draft.group);

    var suggestions = [];
    state.links.forEach(function (l) { if (suggestions.indexOf(l.group) < 0) suggestions.push(l.group); });
    var iconKeys = ['google', 'gmail', 'drive', 'docs', 'microsoft', 'onedrive', 'outlook', 'amazon', 'xero', 'wix', 'dropbox', 'postoffice', 'globe'];

    var m = document.getElementById('modal');
    m.innerHTML =
      '<div id="overlay" style="position:fixed;inset:0;background:rgba(12,19,48,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50">' +
        '<div id="dialog" style="width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lift);padding:24px">' +
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">' +
            '<h3 style="margin:0;font-size:19px;font-weight:700">' + (editId ? 'Edit link' : 'Add a link') + '</h3>' +
            '<span style="flex:1"></span>' +
            '<button class="modal-close" data-act="close" style="width:30px;height:30px;border-radius:9px;border:0;background:var(--surface2);color:var(--text-dim);font-size:14px;cursor:pointer">✕</button>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:14px">' +
            field('Name', 'd-name', draft.name, 'Stock Manager') +
            field('URL', 'd-url', draft.url, 'https://…') +
            field('Group', 'd-group', draft.group, 'Operations', 'qos-groups') +
            '<datalist id="qos-groups">' + suggestions.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('') + '</datalist>' +
            field('Icon', 'd-icon', draft.icon, 'Auto · or google, gmail, emoji, image URL', 'qos-icons') +
            '<datalist id="qos-icons">' + iconKeys.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('') + '</datalist>' +
            '<div style="display:flex;flex-direction:column;gap:6px">' +
              '<span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)">Colour</span>' +
              '<div style="display:flex;align-items:center;gap:12px">' +
                '<input type="color" id="d-color" value="' + esc(colorVal) + '" style="width:46px;height:38px;flex:none;padding:0;border:1px solid var(--line);border-radius:11px;background:none;cursor:pointer">' +
                '<label style="display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer"><input type="checkbox" id="d-color-auto"' + (autoColor ? ' checked' : '') + ' style="width:16px;height:16px;cursor:pointer"> Auto (from name)</label>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:10px;margin-top:22px">' +
            (editId ? '<button class="delete-btn" data-act="delete" style="height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:transparent;color:#C2415A;font-size:14px;font-weight:600;cursor:pointer">Delete</button>' : '') +
            '<span style="flex:1"></span>' +
            '<button data-act="close" style="height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px;font-weight:600;cursor:pointer">Cancel</button>' +
            '<button class="primary-btn" data-act="save" style="height:42px;padding:0 22px;border-radius:11px;border:0;background:var(--navy);color:#fff;font-size:14px;font-weight:600;cursor:pointer">Save</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    var nameInput = document.getElementById('d-name');
    if (nameInput) nameInput.focus();
  }

  function field(label, id, value, placeholder, list) {
    return '<label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)">' + esc(label) +
      '<input id="' + id + '" value="' + esc(value) + '" placeholder="' + esc(placeholder) + '"' + (list ? ' list="' + list + '"' : '') + ' style="border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:11px;padding:11px 13px;font-size:15px;font-weight:500;outline:none;text-transform:none;letter-spacing:normal">' +
      '</label>';
  }

  function closeModal() {
    state.modalOpen = false;
    state.editId = null;
    document.getElementById('modal').innerHTML = '';
  }

  function saveLink() {
    var name = (document.getElementById('d-name').value || '').trim();
    var url = (document.getElementById('d-url').value || '').trim();
    var group = (document.getElementById('d-group').value || '').trim() || 'Other';
    var icon = (document.getElementById('d-icon').value || '').trim();
    var auto = document.getElementById('d-color-auto').checked;
    var color = auto ? '' : (document.getElementById('d-color').value || '');
    if (!name || !url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

    if (state.editId) {
      var l = findLink(state.editId);
      if (l) {
        l.name = name; l.url = url; l.group = group;
        if (icon) l.icon = icon; else delete l.icon;
        if (color) l.color = color; else delete l.color;
      }
    } else {
      var link = { id: 'l' + Date.now(), name: name, url: url, group: group, fav: false };
      if (icon) link.icon = icon;
      if (color) link.color = color;
      state.links.push(link);
    }
    persist();
    closeModal();
    renderContent();
  }

  function deleteLink() {
    var id = state.editId;
    state.links = state.links.filter(function (l) { return l.id !== id; });
    state.recents = state.recents.filter(function (r) { return r !== id; });
    persist();
    closeModal();
    renderContent();
  }

  // ================= EVENTS =================

  function onSearchKey(e) {
    if (e.key !== 'Enter') return;
    var v = view();
    var first = v.visible[0];
    if (first && v.q) { recordOpen(first.id); window.open(first.url, '_blank', 'noopener'); }
    else if (v.q) window.open('https://www.google.com/search?q=' + encodeURIComponent(state.query), '_blank', 'noopener');
  }

  function setLayout(layout) {
    state.layout = layout;
    persist();
    // update tab styles + content without rebuilding search field
    document.querySelectorAll('.tab').forEach(function (b) {
      b.setAttribute('style', tabStyle(b.getAttribute('data-act') === layout));
    });
    renderContent();
  }

  function toggleTheme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    persist();
    document.getElementById('wrap').setAttribute('data-theme', state.theme);
    var tb = document.querySelector('.theme-btn');
    if (tb) tb.textContent = state.theme === 'dark' ? '☀' : '☾';
  }

  function resetAll() {
    // Re-seed from the shared config, discarding local edits.
    fetchConfig().then(function (config) {
      var cfgLinks = (config && Array.isArray(config.links)) ? config.links : [];
      state.links = cfgLinks.map(function (l, i) {
        var o = { id: 'l' + i, name: l.name, url: l.url, group: l.group || 'Other', fav: !!l.fav };
        if (l.icon) o.icon = l.icon;
        if (l.color) o.color = l.color;
        return o;
      });
      state.recents = [];
      state.groupColors = (config && config.groupColors) || {};
      state.collapsed = {};
      state.version = (config && config.version) || state.version;
      persist();
      renderContent();
    });
  }

  // Global click delegation
  document.addEventListener('click', function (e) {
    // record recent when a link anchor is clicked (do not preventDefault)
    var anchor = e.target.closest('[data-open]');
    if (anchor) { recordOpen(anchor.getAttribute('data-open')); /* allow navigation */ }

    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    var id = btn.getAttribute('data-id');

    if (act === 'grouped') setLayout('grouped');
    else if (act === 'compact') setLayout('compact');
    else if (act === 'theme') toggleTheme();
    else if (act === 'add') openModal(null);
    else if (act === 'reset') resetAll();
    else if (act === 'fav') { e.preventDefault(); e.stopPropagation(); toggleFav(id); }
    else if (act === 'edit') { e.preventDefault(); e.stopPropagation(); openModal(id); }
    else if (act === 'close') closeModal();
    else if (act === 'save') saveLink();
    else if (act === 'delete') deleteLink();
    else if (act === 'collapse') toggleCollapse(btn.getAttribute('data-group'));
  });

  function toggleCollapse(name) {
    if (state.collapsed[name]) delete state.collapsed[name];
    else state.collapsed[name] = true;
    persist();
    renderContent();
  }

  // Editable tab colours: live-update the group's --gc while the picker is open,
  // then persist. No re-render, so the native colour picker stays open.
  document.addEventListener('input', function (e) {
    var sw = e.target.closest ? e.target.closest('input.gc-swatch') : null;
    if (!sw) return;
    var name = sw.getAttribute('data-gc');
    var color = sw.value;
    state.groupColors[name] = color;
    // Update every section for this group (only one layout shows at a time, but be safe).
    document.querySelectorAll('.gc-swatch').forEach(function (el) {
      if (el.getAttribute('data-gc') !== name) return;
      var sec = el.closest('section');
      if (sec) sec.style.setProperty('--gc', color);
    });
    persist();
  });

  // Overlay click closes modal (but not clicks inside the dialog)
  document.addEventListener('mousedown', function (e) {
    if (e.target && e.target.id === 'overlay') closeModal();
  });

  // Drag & drop reorder (delegated) with visual feedback.
  function clearDropTargets() {
    document.querySelectorAll('.drop-target').forEach(function (el) { el.classList.remove('drop-target'); });
  }
  document.addEventListener('dragstart', function (e) {
    var el = e.target.closest('[data-id]');
    if (!el) return;
    drag = el.getAttribute('data-id');
    el.classList.add('dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', drag); } catch (err) {}
    }
  });
  document.addEventListener('dragover', function (e) {
    var el = e.target.closest('[data-id]');
    if (!el) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    if (el.getAttribute('data-id') !== drag && !el.classList.contains('drop-target')) {
      clearDropTargets();
      el.classList.add('drop-target');
    }
  });
  document.addEventListener('drop', function (e) {
    var el = e.target.closest('[data-id]');
    clearDropTargets();
    if (!el) return;
    e.preventDefault();
    move(drag, el.getAttribute('data-id'));
    drag = null;
  });
  document.addEventListener('dragend', function () {
    drag = null;
    clearDropTargets();
    document.querySelectorAll('.dragging').forEach(function (el) { el.classList.remove('dragging'); });
  });

  // Esc closes modal
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.modalOpen) closeModal();
  });

  // ================= BOOT =================

  function fetchConfig() {
    return fetch('config/links.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  function boot() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    fetchConfig().then(function (config) {
      if (!config) {
        // Config unreachable: fall back to whatever we have saved, else empty.
        if (saved && Array.isArray(saved.links)) {
          state.links = saved.links; state.recents = saved.recents || [];
          state.groupColors = saved.groupColors || {};
          state.collapsed = saved.collapsed || {};
          state.theme = saved.theme || state.theme; state.layout = saved.layout || state.layout;
          state.version = saved.version || 0;
        }
      } else {
        seedFrom(config, saved);
      }
      shell();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
