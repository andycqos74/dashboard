<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QoS Staff Dashboard</title>
<link rel="icon" href="assets/qos-crest.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1D2C69; --navy-deep:#131E4A; --navy-soft:#3A4C96;
    --bg:#F4F6FB; --bg2:#EAEEF7; --surface:#FFFFFF; --surface2:#F8FAFD;
    --text:#12193A; --text-dim:#5C6588; --line:#E1E6F2; --line-strong:#CFD6E9;
    --tile:#FFFFFF; --shadow:0 1px 2px rgba(19,30,74,.06),0 8px 24px rgba(19,30,74,.07);
    --shadow-lift:0 2px 6px rgba(19,30,74,.10),0 18px 40px rgba(19,30,74,.16);
  }
  [data-theme="dark"]{
    --bg:#0C1330; --bg2:#111A3D; --surface:#151F45; --surface2:#1B2653;
    --text:#EEF1FA; --text-dim:#95A0C6; --line:#26325E; --line-strong:#35426F;
    --tile:#182352; --navy:#5A73D6; --navy-soft:#8DA0EA;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
    --shadow-lift:0 2px 8px rgba(0,0,0,.45),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Barlow,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--navy);text-decoration:none}
  a:hover{color:var(--navy-soft)}
  input,button{font-family:inherit}
  ::placeholder{color:var(--text-dim);opacity:1}

  /* Hover motion (design uses style-hover; recreated with real CSS) */
  .tile:hover,.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)!important;border-color:var(--line-strong)!important}
  .recent-chip:hover{border-color:var(--line-strong)!important;color:var(--navy)!important}
  .compact-row:hover{background:var(--surface2)}
  .theme-btn:hover,.tab:hover{border-color:var(--line-strong)}
  .primary-btn:hover{background:var(--navy-soft)!important}
  .edit-btn:hover{opacity:1!important;background:var(--surface2)!important}
  .modal-close:hover{color:var(--text)!important}
  .reset-btn:hover{color:var(--navy)!important}
  .delete-btn:hover{border-color:#C2415A!important}
  .link-btn{-webkit-tap-highlight-color:transparent;cursor:pointer}

  /* Drag & drop feedback */
  [data-id]{cursor:grab}
  [data-id]:active{cursor:grabbing}
  .dragging{opacity:.4}
  .drop-target{outline:2px dashed var(--gc,var(--navy));outline-offset:2px;border-radius:12px}
  .chev:hover{opacity:.7}

  /* Logo slots: image fills the frame per logoFit; fallback centres a brand
     mark or the monogram (the design's sanctioned no-logo fallback). */
  .logo-img{width:100%;height:100%;display:block}
  .logo-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
           font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;letter-spacing:.02em}
  .logo-fb.big > .logo-fb svg{width:60%;height:60%}
  .logo-fb svg{display:block}

  /* Native colour-input chrome reset */
  input[type=color]{-webkit-appearance:none;appearance:none}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:4px}
  input[type=color]::-moz-color-swatch{border:none;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>

<script src="storage.js"></script>
<script>
(function () {
  "use strict";

  var KEY = 'qos-dash-v1';
  var HUES = [258, 232, 212, 282, 196, 244];
  var DEFAULT_GC = '#3A55C6';

  // Card size presets — scale grid, gaps, radii, logo height, badge and type.
  var SIZES = {
    compact:     { grid:180, gap:10, radius:14, pad:'12px 12px 11px', innerGap:8,  pinPad:'11px 12px', pinGap:10, badge:32, badgeFont:13, badgeRadius:9,  nameFont:13.5, hostFont:11.5, logoHeight:88 },
    comfortable: { grid:230, gap:14, radius:18, pad:'17px 17px 15px', innerGap:12, pinPad:'15px 15px', pinGap:13, badge:38, badgeFont:16, badgeRadius:11, nameFont:16,   hostFont:12.5, logoHeight:116 },
    large:       { grid:300, gap:18, radius:20, pad:'24px 24px 20px', innerGap:14, pinPad:'19px 20px', pinGap:16, badge:52, badgeFont:20, badgeRadius:14, nameFont:19,   hostFont:14,   logoHeight:152 }
  };

  // ---- state ----
  var state = {
    links: [],           // [{id,name,url,group,fav,logo?,icon?,color?}]
    recents: [],         // link ids, most-recent first, max 6
    groupColors: {},     // { groupName: '#rrggbb' }
    collapsed: {},       // { groupName: true }
    theme: 'light',
    layout: 'grouped',   // grouped | compact
    cardSize: 'comfortable',
    logoFit: 'contain',  // contain | cover
    query: '',
    modalOpen: false,
    editId: null,
    version: 0
  };
  var drag = null;

  function sz() { return SIZES[state.cardSize] || SIZES.comfortable; }

  // ---- helpers ----
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function host(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch (e) { return String(url).replace(/^https?:\/\//, '').split('/')[0]; }
  }
  function initials(name) {
    var w = name.replace(/[^\w\s&]/g, ' ').split(/\s+/).filter(Boolean);
    return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
  }
  function hueFor(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 997;
    return HUES[h % HUES.length];
  }
  function gcFor(name) { return state.groupColors[name] || DEFAULT_GC; }
  function hexToRgba(hex, a) {
    var h = String(hex).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    if (isNaN(n)) return 'rgba(90,100,140,' + a + ')';
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function favStyle(fav) {
    return "width:26px;height:26px;border-radius:8px;border:0;background:transparent;font-size:13px;cursor:pointer;color:" + (fav ? 'var(--navy)' : 'var(--text-dim)') + ";opacity:" + (fav ? 1 : 0.5);
  }

  // ---- brand icons (inline SVG, self-contained/offline) ----
  var BRANDS = {
    google: '<svg viewBox="0 0 48 48" width="22" height="22"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.5-2.1 14.3-5.6l-6.6-5.6C29.7 34.5 27 35.5 24 35.5c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.4l6.6 5.6C41.9 35.7 44 30.3 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>',
    gmail: '<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#EA4335" d="M2 5.6C2 4.7 2.7 4 3.6 4L12 10.4 20.4 4c.9 0 1.6.7 1.6 1.6v12.8c0 .9-.7 1.6-1.6 1.6H19V9.2l-7 5.2-7-5.2V20H3.6C2.7 20 2 19.3 2 18.4V5.6z"/></svg>',
    drive: '<svg viewBox="0 0 87.3 78" width="22" height="22"><path fill="#0066da" d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z"/><path fill="#00ac47" d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44c-.8 1.4-1.2 2.95-1.2 4.5h27.5z"/><path fill="#ea4335" d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z"/><path fill="#00832d" d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z"/><path fill="#2684fc" d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z"/><path fill="#ffba00" d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z"/></svg>',
    docs: '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="2" width="16" height="20" rx="2" fill="#7248B9"/><rect x="7" y="7" width="10" height="1.6" fill="#fff"/><rect x="7" y="11" width="10" height="1.6" fill="#fff"/><rect x="7" y="15" width="6" height="1.6" fill="#fff"/></svg>',
    microsoft: '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="2" width="9" height="9" fill="#F25022"/><rect x="13" y="2" width="9" height="9" fill="#7FBA00"/><rect x="2" y="13" width="9" height="9" fill="#00A4EF"/><rect x="13" y="13" width="9" height="9" fill="#FFB900"/></svg>',
    onedrive: '<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#0364B8" d="M13.2 7.2a5 5 0 0 0-4.7 3.1A4 4 0 0 0 5 17.5h12.7a3.4 3.4 0 0 0 .2-6.8 5 5 0 0 0-4.7-3.5z"/></svg>',
    outlook: '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="9" y="5" width="13" height="14" rx="1.2" fill="#0A2767"/><rect x="9" y="5" width="13" height="7" fill="#0364B8"/><rect x="1" y="4" width="12" height="16" rx="2" fill="#0F6CBD"/><ellipse cx="7" cy="12" rx="3.1" ry="3.5" fill="none" stroke="#fff" stroke-width="1.6"/></svg>',
    amazon: '<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#FF9900" d="M4 16c4.5 3 11.5 3 16 .2.4-.2.7.2.4.5C17.8 20 13 21 9 19.4 6.7 18.5 5 17.2 4 16z"/><path fill="#221F1F" d="M13 5c-2.5 0-4 1.3-4.3 3l2 .2c.1-1 .8-1.5 2-1.5 1.3 0 1.8.7 1.8 2v.4c-3.7 0-5.8 1.1-5.8 3.6 0 1.6 1.2 2.6 3 2.6 1.4 0 2.3-.5 3-1.4.2.7.9 1.2 1.7 1.3l1-1.4c-.6-.3-.8-.7-.8-1.6V8.6C16.6 6.2 15.4 5 13 5zm1.5 6.6c0 1.3-.8 2.1-2 2.1-.8 0-1.3-.5-1.3-1.2 0-1.2 1.1-1.7 3.3-1.7z"/></svg>',
    xero: '<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="10" fill="#13B5EA"/><path d="M9 9l6 6M15 9l-6 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
    wix: '<svg viewBox="0 0 24 24" width="22" height="22"><text x="12" y="16" font-family="Arial,sans-serif" font-weight="700" font-size="8.5" fill="#0C6EFC" text-anchor="middle">WIX</text></svg>',
    dropbox: '<svg viewBox="0 0 24 24" width="20" height="20"><path fill="#0061FF" d="M7 3 2 6.3l5 3.2 5-3.2zM17 3l-5 3.3 5 3.2 5-3.2zM2 12.7l5 3.2 5-3.2-5-3.2zM17 9.5l-5 3.2 5 3.2 5-3.2zM7 17.5l5 3.2 5-3.2-5-3.1z"/></svg>',
    postoffice: '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="3" fill="#E4002B"/><text x="12" y="16" font-family="Arial,sans-serif" font-weight="700" font-size="10" fill="#fff" text-anchor="middle">PO</text></svg>',
    globe: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#5C6588" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>'
  };
  var BRAND_ALIAS = { forms:'docs', sheets:'docs', office:'microsoft', office365:'microsoft', sharepoint:'onedrive', teams:'microsoft', hotmail:'outlook' };
  function brandKey(k) { k = String(k || '').toLowerCase().trim(); return BRAND_ALIAS[k] || (BRANDS[k] ? k : ''); }

  function detectBrand(url, name) {
    var s = host(url).toLowerCase() + ' ' + (name || '').toLowerCase();
    if (/mail\.google|gmail/.test(s)) return 'gmail';
    if (/drive\.google/.test(s)) return 'drive';
    if (/docs\.google|forms\.google|\bforms\b|google\s*forms|sheets/.test(s)) return 'docs';
    if (/google/.test(s)) return 'google';
    if (/postoffice|post ?office|drop.?and.?go/.test(s)) return 'postoffice';
    if (/onedrive|1drv|live\.com|sharepoint/.test(s)) return 'onedrive';
    if (/outlook|hotmail/.test(s)) return 'outlook';
    if (/microsoft|office\.com|office365|\bms ?office\b|\bteams\b/.test(s)) return 'microsoft';
    if (/amazon/.test(s)) return 'amazon';
    if (/xero/.test(s)) return 'xero';
    if (/wix/.test(s)) return 'wix';
    if (/dropbox/.test(s)) return 'dropbox';
    return '';
  }

  // Accent colours: explicit hex, else the name-hashed hue.
  function accent(l) {
    if (l.color) return { text:l.color, bg:hexToRgba(l.color, .14), border:hexToRgba(l.color, .34), dot:l.color };
    var hue = hueFor(l.name);
    return {
      text: 'oklch(0.42 0.14 ' + hue + ')',
      bg:   'oklch(0.93 0.045 ' + hue + ')',
      border:'oklch(0.87 0.06 ' + hue + ')',
      dot:  'oklch(0.58 0.15 ' + hue + ')'
    };
  }

  // Contents of a logo slot: real logo image → brand mark → monogram.
  function logoContent(l, big) {
    var ac = accent(l);
    var src = l.logo ? Storage.url(l.logo) : null;   // resolves store: keys
    if (src) {
      return '<img class="logo-img" src="' + esc(src) + '" alt="" loading="lazy" ' +
        'style="object-fit:' + state.logoFit + '" ' +
        'onerror="this.parentNode.innerHTML=this.parentNode.getAttribute(\'data-fb\')">';
    }
    return fallbackMark(l, big, ac);
  }
  // Every stored-image key currently referenced by a link.
  function logoKeys() {
    return state.links.map(function (l) { return l.logo; }).filter(Boolean);
  }
  // No logo image: show the brand mark / monogram. On the small square slots the
  // badge fills the slot; on the wide card banner it sits centred on the neutral
  // slot background, keeping the design's --surface2 logo area.
  function fallbackMark(l, big, ac) {
    var raw = (l.icon || '').trim();
    var key = brandKey(raw || detectBrand(l.url, l.name));
    var s = sz();
    var inner;
    if (key && BRANDS[key]) inner = BRANDS[key];
    else if (/^https?:\/\//i.test(raw)) inner = '<img class="logo-img" src="' + esc(raw) + '" alt="" style="object-fit:' + state.logoFit + '">';
    else if (raw) inner = '<span style="font-size:' + (big ? 26 : 20) + 'px;line-height:1">' + esc(raw) + '</span>';
    else inner = esc(initials(l.name));

    if (!big) {
      return '<span class="logo-fb" style="background:' + ac.bg + ';color:' + ac.text + ';font-size:' + s.badgeFont + 'px">' + inner + '</span>';
    }
    var badge = Math.round(s.badge * 1.35);
    return '<span class="logo-fb big">' +
      '<span class="logo-fb" style="width:' + badge + 'px;height:' + badge + 'px;flex:none;border-radius:' + s.badgeRadius + 'px;' +
        'background:' + ac.bg + ';color:' + ac.text + ';border:1px solid ' + ac.border + ';font-size:' + Math.round(s.badgeFont * 1.25) + 'px">' +
        inner + '</span></span>';
  }
  // Fallback markup stashed on the slot so a broken image can swap to it.
  function slot(l, wrapStyle, big) {
    var ac = accent(l);
    return '<span style="' + wrapStyle + '" data-fb="' + esc(fallbackMark(l, big, ac)) + '">' + logoContent(l, big) + '</span>';
  }

  // ---- persistence ----
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        version: state.version, links: state.links, recents: state.recents,
        groupColors: state.groupColors, collapsed: state.collapsed,
        theme: state.theme, layout: state.layout,
        cardSize: state.cardSize, logoFit: state.logoFit
      }));
    } catch (e) {}
  }

  function mapConfigLinks(cfgLinks) {
    return cfgLinks.map(function (l, i) {
      var o = { id:'l' + i, name:l.name, url:l.url, group:l.group || 'Other', fav:!!l.fav };
      if (l.logo) o.logo = l.logo;
      if (l.icon) o.icon = l.icon;
      if (l.color) o.color = l.color;
      return o;
    });
  }

  function seedFrom(config, saved) {
    var cfgVersion = (config && config.version) || 1;
    var cfgLinks = (config && Array.isArray(config.links)) ? config.links : [];
    var cfgColors = (config && config.groupColors) || {};

    if (saved) {
      state.theme = saved.theme || state.theme;
      state.layout = saved.layout || state.layout;
      state.cardSize = saved.cardSize || state.cardSize;
      state.logoFit = saved.logoFit || state.logoFit;
      state.collapsed = saved.collapsed || {};
    }

    if (saved && Array.isArray(saved.links) && saved.version === cfgVersion) {
      state.links = saved.links;
      state.recents = Array.isArray(saved.recents) ? saved.recents : [];
      state.groupColors = saved.groupColors || cfgColors;
    } else {
      state.links = mapConfigLinks(cfgLinks);
      state.recents = [];
      state.groupColors = cfgColors;
    }
    state.version = cfgVersion;
    persist();
  }

  // ---- link ops ----
  function findLink(id) {
    for (var i = 0; i < state.links.length; i++) if (state.links[i].id === id) return state.links[i];
    return null;
  }
  function recordOpen(id) {
    state.recents = [id].concat(state.recents.filter(function (r) { return r !== id; })).slice(0, 6);
    persist(); renderContent();
  }
  function toggleFav(id) {
    var l = findLink(id);
    if (l) { l.fav = !l.fav; persist(); renderContent(); }
  }
  function move(fromId, toId) {
    if (!fromId || fromId === toId) return;
    var from = -1, to = -1, i;
    for (i = 0; i < state.links.length; i++) {
      if (state.links[i].id === fromId) from = i;
      if (state.links[i].id === toId) to = i;
    }
    if (from < 0 || to < 0) return;
    var item = state.links.splice(from, 1)[0];
    item.group = state.links[to > from ? to - 1 : to].group;
    state.links.splice(to, 0, item);
    persist(); renderContent();
  }

  // ---- derived view ----
  function decorate(l) {
    var s = sz(), ac = accent(l);
    var padParts = s.pad.split(' ');
    return {
      id:l.id, name:l.name, url:l.url, group:l.group, fav:l.fav, raw:l,
      host: host(l.url),
      nameStyle: 'font-size:' + s.nameFont + 'px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis',
      hostStyle: 'font-size:' + s.hostFont + 'px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis',
      hostInlineStyle: 'margin-left:auto;font-size:' + s.hostFont + 'px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%',
      pinnedStyle: 'position:relative;display:flex;align-items:center;gap:' + s.pinGap + 'px;background:var(--tile);border:1px solid var(--line);border-radius:' + s.radius + 'px;padding:' + s.pinPad + ';box-shadow:var(--shadow);color:var(--text);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease',
      cardOuterStyle: 'position:relative;background:var(--tile);border:1px solid var(--line);border-radius:' + s.radius + 'px;box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease',
      cardAnchorStyle: 'display:flex;flex-direction:column;gap:' + s.innerGap + 'px;padding:0 0 ' + (padParts[2] || '15px') + ';color:var(--text)',
      cardLogoWrapStyle: 'display:block;width:100%;height:' + s.logoHeight + 'px;border-radius:' + s.radius + 'px ' + s.radius + 'px 0 0;overflow:hidden;background:var(--surface2);margin-bottom:' + s.innerGap + 'px',
      cardTextWrapStyle: 'display:flex;flex-direction:column;gap:3px;min-width:0;padding:0 ' + (padParts[1] || padParts[0]),
      logoWrapStyle: 'display:block;width:' + s.badge + 'px;height:' + s.badge + 'px;flex:none;border-radius:9px;overflow:hidden;background:var(--surface2)',
      rowLogoWrapStyle: 'display:block;width:' + Math.max(s.badge - 8, 20) + 'px;height:' + Math.max(s.badge - 8, 20) + 'px;flex:none;border-radius:7px;overflow:hidden;background:var(--surface2)',
      dotStyle: 'width:9px;height:9px;flex:none;border-radius:3px;background:' + ac.dot,
      favS: favStyle(l.fav)
    };
  }
  function view() {
    var q = state.query.trim().toLowerCase();
    var match = function (l) {
      return !q || l.name.toLowerCase().indexOf(q) >= 0 ||
        l.url.toLowerCase().indexOf(q) >= 0 ||
        (l.group || '').toLowerCase().indexOf(q) >= 0;
    };
    var visible = state.links.filter(match).map(decorate);
    var groupNames = [];
    visible.forEach(function (l) { if (groupNames.indexOf(l.group) < 0) groupNames.push(l.group); });
    var groups = groupNames.map(function (name) {
      var links = visible.filter(function (l) { return l.group === name; });
      return { name: name, links: links, count: links.length };
    });
    return {
      q:q, visible:visible, groups:groups, groupNames:groupNames,
      favourites: visible.filter(function (l) { return l.fav; }),
      recents: state.recents.map(function (id) { return findLink(id); }).filter(Boolean).map(decorate)
    };
  }

          '<span style="font-size:13px;color:var(--text-dim)">Your most-used tools</span></div>' +

        v.recents.map(function (l) {

              g.links.map(cardHTML).join('') + '</div>') + '</section>';

    } else {
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start">' +
        v.groups.map(function (g) {
          var collapsed = !!state.collapsed[g.name];

            '<div style="padding:13px 14px 11px">' + groupHeader(g, '13.5px', collapsed) + '</div>' +
            (collapsed ? '' : '<div style="display:flex;flex-direction:column">' + g.links.map(compactRowHTML).join('') + '</div>') + '</section>';
        }).join('') + '</div>';
    }

    document.getElementById('content').innerHTML = html;

  // Re-render just the logo field, keeping the rest of the draft intact.
  function refreshLogoField() {
    var current = (document.getElementById('d-logo') || {}).value || '';
    var holder = document.getElementById('d-drop');
    if (!holder) return;
    var wrap = holder.parentNode;
    wrap.outerHTML = logoField(current);
    wireLogoField();
  }

  function wireLogoField() {
    var drop = document.getElementById('d-drop');
    var picker = document.getElementById('d-file');
    var urlInput = document.getElementById('d-logo');
    if (!drop || !picker) return;

    if (Storage.uploadsEnabled()) {
      drop.addEventListener('click', function (e) {
        if (e.target.closest('[data-act="logo-clear"]')) return;
        picker.click();
      });
      picker.addEventListener('change', function () {
        if (picker.files && picker.files[0]) acceptLogoFile(picker.files[0], refreshLogoField);
      });
      ['dragenter', 'dragover'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) {
          if (!hasFiles(e)) return;
          e.preventDefault(); e.stopPropagation();
          drop.style.borderColor = 'var(--navy)';
        });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        drop.addEventListener(ev, function () { drop.style.borderColor = 'var(--line-strong)'; });
      });
      drop.addEventListener('drop', function (e) {
        if (!hasFiles(e)) return;
        e.preventDefault(); e.stopPropagation();
        acceptLogoFile(e.dataTransfer.files[0], refreshLogoField);
      });
    }
    if (urlInput) urlInput.addEventListener('change', refreshLogoField);
  }

  function hasFiles(e) {
    var dt = e.dataTransfer;
    if (!dt) return false;
    if (dt.files && dt.files.length) return true;
    return dt.types && Array.prototype.indexOf.call(dt.types, 'Files') >= 0;
  }

  // Logo field: a drop zone that doubles as a preview. Drag an image in, click
  // to pick one, or paste a URL — mirroring the design's image slot.
  function logoField(logo) {
    var src = logo ? Storage.url(logo) : null;
    var enabled = Storage.uploadsEnabled();
    return '<div style="display:flex;flex-direction:column;gap:6px">' +
      '<span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)">Logo</span>' +
      '<div id="d-drop" style="display:flex;align-items:center;gap:13px;border:1px dashed var(--line-strong);background:var(--surface2);border-radius:11px;padding:11px 13px;' + (enabled ? 'cursor:pointer' : '') + '">' +
        '<span id="d-preview" style="display:flex;align-items:center;justify-content:center;width:46px;height:46px;flex:none;border-radius:9px;overflow:hidden;background:var(--surface);border:1px solid var(--line)">' +
          (src ? '<img class="logo-img" src="' + esc(src) + '" alt="" style="object-fit:contain">'
               : '<span style="font-size:18px;color:var(--text-dim)">🖼</span>') + '</span>' +
        '<span style="display:flex;flex-direction:column;gap:2px;min-width:0">' +
          '<span id="d-logo-label" style="font-size:14px;font-weight:600;color:var(--text)">' +
            (logo ? 'Logo set' : (enabled ? 'Drop an image, or click to choose' : 'Paste an image URL below')) + '</span>' +
          '<span id="d-logo-note" style="font-size:12px;color:var(--text-dim)">' +
            (enabled ? 'PNG, SVG or JPG · stored in ' + esc(Storage.driverName()) : 'Uploads are disabled') + '</span>' +
        '</span>' +
        (logo ? '<button type="button" data-act="logo-clear" style="margin-left:auto;flex:none;height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer">Remove</button>' : '') +
      '</div>' +
      '<input type="file" id="d-file" accept="image/*" style="display:none">' +
      '<input id="d-logo" value="' + esc(logo || '') + '" placeholder="…or paste an image URL" style="border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:11px;padding:9px 13px;font-size:13.5px;font-weight:500;outline:none">' +
    '</div>';
  }

  // Take a File from a picker/drop, store it, and point the draft at it.
  function acceptLogoFile(file, onDone) {
    var label = document.getElementById('d-logo-label');
    var note = document.getElementById('d-logo-note');
    if (label) label.textContent = 'Uploading…';
    Storage.put(file).then(function (key) {
      var input = document.getElementById('d-logo');
      if (input) input.value = key;
      if (onDone) onDone(key);
    }).catch(function (err) {
      if (label) label.textContent = 'Upload failed';
      if (note) { note.textContent = err.message || String(err); note.style.color = '#C2415A'; }
    });
  }

  function field(label, id, value, placeholder, list) {
    return '<label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)">' + esc(label) +
      '<input id="' + id + '" value="' + esc(value) + '" placeholder="' + esc(placeholder) + '"' + (list ? ' list="' + list + '"' : '') + ' style="border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:11px;padding:11px 13px;font-size:15px;font-weight:500;outline:none;text-transform:none;letter-spacing:normal">' +
      '</label>';
  }

  function closeModal() {
    state.modalOpen = false; state.editId = null;
    document.getElementById('modal').innerHTML = '';
  }

  function saveLink() {
    var name = (document.getElementById('d-name').value || '').trim();
    var url = (document.getElementById('d-url').value || '').trim();
    var group = (document.getElementById('d-group').value || '').trim() || 'Other';
    var logo = (document.getElementById('d-logo').value || '').trim();
    var icon = (document.getElementById('d-icon').value || '').trim();
    var auto = document.getElementById('d-color-auto').checked;
    var color = auto ? '' : (document.getElementById('d-color').value || '');
    if (!name || !url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

    if (state.editId) {
      var l = findLink(state.editId);
      if (l) {
        l.name = name; l.url = url; l.group = group;
        if (logo) l.logo = logo; else delete l.logo;
        if (icon) l.icon = icon; else delete l.icon;
        if (color) l.color = color; else delete l.color;
      }
    } else {
      var link = { id:'l' + Date.now(), name:name, url:url, group:group, fav:false };
      if (logo) link.logo = logo;
      if (icon) link.icon = icon;
      if (color) link.color = color;
      state.links.push(link);
    }
    persist(); closeModal(); renderContent();
  }

  function deleteLink() {
    var id = state.editId;
    state.links = state.links.filter(function (l) { return l.id !== id; });
    state.recents = state.recents.filter(function (r) { return r !== id; });
    persist(); closeModal(); renderContent();
  }

  // ================= EVENTS =================

  function onSearchKey(e) {
    if (e.key !== 'Enter') return;
    var v = view(), first = v.visible[0];
    if (first && v.q) { recordOpen(first.id); window.open(first.url, '_blank', 'noopener'); }
    else if (v.q) window.open('https://www.google.com/search?q=' + encodeURIComponent(state.query), '_blank', 'noopener');
  }

  function setLayout(layout) {
    state.layout = layout; persist();
    document.querySelectorAll('.tab').forEach(function (b) {
      b.setAttribute('style', tabStyle(b.getAttribute('data-act') === layout));
    });
    renderContent();
  }
  function setSize(size) {
    if (!SIZES[size]) return;
    state.cardSize = size; persist();
    document.querySelectorAll('.sizetab').forEach(function (b) {
      b.setAttribute('style', sizeTabStyle(b.getAttribute('data-size') === size));
    });
    renderContent();
  }
  function toggleLogoFit() {
    state.logoFit = state.logoFit === 'contain' ? 'cover' : 'contain';
    persist();
    var b = document.querySelector('[data-act="logofit"]');
    if (b) b.textContent = 'Logos: ' + state.logoFit;
    renderContent();
  }
  function toggleTheme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    persist();
    document.getElementById('wrap').setAttribute('data-theme', state.theme);
    var tb = document.querySelector('.theme-btn');
    if (tb) tb.textContent = state.theme === 'dark' ? '☀' : '☾';
  }
  function toggleCollapse(name) {
    if (state.collapsed[name]) delete state.collapsed[name]; else state.collapsed[name] = true;
    persist(); renderContent();
  }
  function resetAll() {
    fetchConfig().then(function (config) {
      var cfgLinks = (config && Array.isArray(config.links)) ? config.links : [];
      state.links = mapConfigLinks(cfgLinks);
      state.recents = [];
      state.groupColors = (config && config.groupColors) || {};
      state.collapsed = {};
      state.version = (config && config.version) || state.version;
      persist(); renderContent();
    });
  }

  document.addEventListener('click', function (e) {
    var anchor = e.target.closest('[data-open]');
    if (anchor) recordOpen(anchor.getAttribute('data-open'));

    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act'), id = btn.getAttribute('data-id');

    if (act === 'grouped') setLayout('grouped');
    else if (act === 'compact') setLayout('compact');
    else if (act === 'size') setSize(btn.getAttribute('data-size'));
    else if (act === 'logofit') toggleLogoFit();
    else if (act === 'theme') toggleTheme();
    else if (act === 'add') openModal(null);
    else if (act === 'reset') resetAll();
    else if (act === 'fav') { e.preventDefault(); e.stopPropagation(); toggleFav(id); }
    else if (act === 'edit') { e.preventDefault(); e.stopPropagation(); openModal(id); }
    else if (act === 'close') closeModal();
    else if (act === 'save') saveLink();
    else if (act === 'delete') deleteLink();
    else if (act === 'collapse') toggleCollapse(btn.getAttribute('data-group'));
    else if (act === 'logo-clear') {
      e.preventDefault(); e.stopPropagation();
      var input = document.getElementById('d-logo');
      if (input) input.value = '';
      refreshLogoField();
    }
  });

  // Editable group colours — live update without re-render so the picker stays open.
  document.addEventListener('input', function (e) {
    var sw = e.target.closest ? e.target.closest('input.gc-swatch') : null;
    if (!sw) return;
    var name = sw.getAttribute('data-gc'), color = sw.value;
    state.groupColors[name] = color;
    document.querySelectorAll('.gc-swatch').forEach(function (el) {
      if (el.getAttribute('data-gc') !== name) return;
      var sec = el.closest('section');
      if (sec) sec.style.setProperty('--gc', color);
    });
    persist();
  });

  document.addEventListener('mousedown', function (e) {
    if (e.target && e.target.id === 'overlay') closeModal();
  });

  // Drag & drop reorder with visual feedback.
  function clearDropTargets() {
    document.querySelectorAll('.drop-target').forEach(function (el) { el.classList.remove('drop-target'); });
  }
  document.addEventListener('dragstart', function (e) {
    var el = e.target.closest('[data-id]');
    if (!el) return;
    drag = el.getAttribute('data-id');
    el.classList.add('dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', drag); } catch (err) {}
    }
  });
  document.addEventListener('dragover', function (e) {
    var el = e.target.closest('[data-id]');
    if (!el) return;
    e.preventDefault();
    var files = hasFiles(e);
    if (e.dataTransfer) e.dataTransfer.dropEffect = files ? 'copy' : 'move';
    if ((files || el.getAttribute('data-id') !== drag) && !el.classList.contains('drop-target')) {
      clearDropTargets(); el.classList.add('drop-target');
    }
  });
  document.addEventListener('drop', function (e) {
    var el = e.target.closest('[data-id]');
    clearDropTargets();
    if (!el) return;
    e.preventDefault();
    // An image dropped from the desktop sets that tile's logo; anything else is
    // a tile being dragged to reorder.
    if (hasFiles(e)) { dropLogoOnTile(el.getAttribute('data-id'), e.dataTransfer.files[0]); return; }
    move(drag, el.getAttribute('data-id'));
    drag = null;
  });

  function dropLogoOnTile(id, file) {
    var link = findLink(id);
    if (!link || !file || !Storage.uploadsEnabled()) return;
    Storage.put(file).then(function (key) {
      link.logo = key;
      persist();
      return Storage.hydrate([key]);
    }).then(renderContent).catch(function (err) {
      console.error('Logo upload failed:', err);
    });
  }
  document.addEventListener('dragend', function () {
    drag = null; clearDropTargets();
    document.querySelectorAll('.dragging').forEach(function (el) { el.classList.remove('dragging'); });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.modalOpen) closeModal();
  });

  // ================= BOOT =================

  function fetchConfig() {
    return fetch('config/links.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }
  function fetchStorageConfig() {
    return fetch('config/storage.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  function boot() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    Promise.all([fetchConfig(), fetchStorageConfig()]).then(function (r) {
      var config = r[0];
      return Storage.init(r[1]).then(function () { return config; });
    }).then(function (config) {
      if (!config) {
        if (saved && Array.isArray(saved.links)) {
          state.links = saved.links; state.recents = saved.recents || [];
          state.groupColors = saved.groupColors || {}; state.collapsed = saved.collapsed || {};
          state.theme = saved.theme || state.theme; state.layout = saved.layout || state.layout;
          state.cardSize = saved.cardSize || state.cardSize; state.logoFit = saved.logoFit || state.logoFit;
          state.version = saved.version || 0;
        }
      } else {
        seedFrom(config, saved);
      }
      // Resolve any stored-image keys before the first paint so logos appear
      // immediately rather than popping in.
      return Storage.hydrate(logoKeys()).then(shell, shell);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
